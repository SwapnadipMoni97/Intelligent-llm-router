[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-llm-router"
version = "0.1.0"
description = "Configurable, policy-driven LLM model router"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "litellm>=1.50,<2", "PyYAML>=6,<7",
  "prometheus-client>=0.21,<1", "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
